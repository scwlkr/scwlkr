    <rect x="16" y="16" width="1248" height="448" fill="url(#grid)"/>
    <circle cx="1002" cy="246" r="284" stroke="#23CE6B" stroke-opacity=".16" stroke-width="2"/>
    <circle cx="1002" cy="246" r="225" stroke="#FFFFFF" stroke-opacity=".08"/>
    <circle cx="1002" cy="246" r="178" stroke="#23CE6B" stroke-opacity=".1" stroke-dasharray="4 14"/>
    <path d="M719 77H1264M719 405H1264" stroke="#FFFFFF" stroke-opacity=".08"/>
    <path d="M752 16V464M1208 16V464" stroke="#FFFFFF" stroke-opacity=".05"/>
    <rect x="1060" y="35" width="180" height="8" fill="url(#ticks)"/>

