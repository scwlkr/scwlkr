<svg width="1280" height="480" viewBox="0 0 1280 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SCWLKR Night Shift Control Room</title>
  <desc id="desc">A charcoal and electric-green control-room banner with the scwlkr raccoon, describing one operator building many connected tools, worlds, and infrastructure projects in Dallas.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity=".045"/>
    </pattern>
    <pattern id="ticks" width="16" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 8V3M8 8V6" stroke="#23CE6B" stroke-opacity=".45"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="16" y="16" width="1248" height="448" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1280" height="480" rx="22" fill="#181818"/>
