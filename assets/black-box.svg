    <text x="20" y="27" fill="#7F7F7F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="800" letter-spacing="1.5">LATEST PUSH</text>
    <text x="20" y="57" fill="#23CE6B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="900">OPENJOB</text>
    <text x="20" y="76" fill="#7F7F7F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">2026.07.23</text>
  </g>

  <text x="52" y="225" fill="#23CE6B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="800" letter-spacing="2">RECENT TRANSMISSIONS</text>
  
    <g transform="translate(58 246)">
      <text fill="#23CE6B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="800">01</text>
