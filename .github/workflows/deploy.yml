name: Deploy to Hostinger

on:
  push:
    branches:
      - master

defaults:
  run:
    working-directory: ./bubba-dashboard

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      
    - name: ⚙️ Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: 📦 Install dependencies
      run: npm install
      
    - name: 🏗️ Build Project
      # Passes the Google Apps Script URL as an environment variable during the build
      env:
        VITE_APPS_SCRIPT_URL: ${{ secrets.VITE_APPS_SCRIPT_URL }}
        BASE_URL: /bubba-dashboard/
      run: npm run build -- --base=/bubba-dashboard/
      
      
    - name: 📝 Inject Commit Hash
      run: |
        sed -i "s/__DEPLOYMENT_VERSION__/${GITHUB_SHA}/g" bubba-dashboard/dist/index.html
        echo "{\"version\": \"${GITHUB_SHA}\", \"date\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}" > bubba-dashboard/dist/version.json
        ls -la bubba-dashboard/dist/
      
    - name: 💿 Install lftp
      run: sudo apt-get update && sudo apt-get install -y lftp
      
    - name: 📂 Deploy via lftp
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      # We connect, enforce explicitly navigating to public_html/bubba-dashboard, 
      # and mirror our local 'bubba-dashboard/dist' directory UP to the target.
      run: |
        lftp -c "
        set ftp:ssl-allow no;
        open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
        mkdir -p public_html/bubba-dashboard;
        cd public_html/bubba-dashboard;
        mirror -R --delete --verbose bubba-dashboard/dist/ ./;
        bye
        "
