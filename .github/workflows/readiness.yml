name: Production readiness

"on":
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check public readiness
        env:
          READINESS_URL: https://scwlkr.com/api/readiness
        run: |
          set -euo pipefail
          readiness_headers="$(mktemp)"
          readiness_body="$(mktemp)"
          trap 'rm -f "$readiness_headers" "$readiness_body"' EXIT

          readiness_status="$(curl \
            --silent \
            --show-error \
            --max-time 20 \
            --dump-header "$readiness_headers" \
            --output "$readiness_body" \
            --write-out '%{http_code}' \
            "$READINESS_URL")"

          test "$readiness_status" = "200"
          grep -Eiq '^cache-control:[[:space:]].*no-store' "$readiness_headers"
          jq -e '.ok == true and .ready == true and .room == "ROOM_1"' "$readiness_body" > /dev/null
