name: Update profile black box

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches:
      - master
    paths:
      - scripts/build-black-box.mjs
      - .github/workflows/update-black-box.yml

permissions:
  contents: write

concurrency:
  group: profile-black-box
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Rebuild public signal
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build-black-box.mjs
      - name: Commit changed signal
        run: |
          if git diff --quiet -- assets/black-box.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/black-box.svg
          git commit -m "chore: refresh profile black box"
          git push
