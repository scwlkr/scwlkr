<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">scwlkr telemetry dashboard</title>
  <desc id="desc">A local SVG dashboard for the scwlkr GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080C12"/>
      <stop offset="0.52" stop-color="#101824"/>
      <stop offset="1" stop-color="#080C12"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00FF9C"/>
      <stop offset="0.5" stop-color="#7C3CFF"/>
      <stop offset="1" stop-color="#FFCC00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#223044" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)" opacity="0.7"/>
  <rect x="1.5" y="1.5" width="1197" height="357" rx="20.5" stroke="url(#neon)" stroke-width="3" opacity="0.9"/>

  <g opacity="0.95">
    <text x="54" y="62" fill="#EAF2FF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="800">SCWLKR TELEMETRY</text>
    <text x="54" y="94" fill="#8FA7C5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">local-first // no fragile external stat cards // all signal</text>
  </g>

  <g transform="translate(54 128)">
    <rect width="330" height="168" rx="18" fill="#0B111A" stroke="#26364D"/>
    <text x="26" y="38" fill="#00FF9C" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="800">MISSIONS</text>
    <text x="26" y="82" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="48" font-weight="900">16</text>
    <text x="106" y="78" fill="#8FA7C5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">public repos</text>
    <text x="26" y="124" fill="#D9E6F7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">companies • tools • labs • agents</text>
  </g>

  <g transform="translate(435 128)">
    <rect width="330" height="168" rx="18" fill="#0B111A" stroke="#26364D"/>
    <text x="26" y="38" fill="#7C3CFF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="800">CORE STACK</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="800">
      <text x="26" y="82" fill="#D9E6F7">TS</text>
      <text x="86" y="82" fill="#D9E6F7">PY</text>
      <text x="146" y="82" fill="#D9E6F7">ZIG</text>
      <text x="226" y="82" fill="#D9E6F7">SWIFT</text>
    </g>
    <path d="M28 116 H302" stroke="#223044" stroke-width="8" stroke-linecap="round"/>
    <path d="M28 116 H248" stroke="url(#neon)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
    <text x="26" y="146" fill="#8FA7C5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">web apps + scripts + ominous CLIs</text>
  </g>

  <g transform="translate(816 128)">
    <rect width="330" height="168" rx="18" fill="#0B111A" stroke="#26364D"/>
    <text x="26" y="38" fill="#FFCC00" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="800">CURRENT ORBIT</text>
    <text x="26" y="78" fill="#D9E6F7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">TMH • DFFW Daily • Dink Boys</text>
    <text x="26" y="110" fill="#D9E6F7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">PaletteWOW • Walker World</text>
    <text x="26" y="142" fill="#8FA7C5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">status: building the strange machine</text>
  </g>

  <g transform="translate(54 322)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" fill="#8FA7C5">
    <text>INPUT: ideas that should not exist yet</text>
    <text x="380">OUTPUT: tiny companies + local internet</text>
    <text x="820">RULE: boring profiles are a bug</text>
  </g>
</svg>
