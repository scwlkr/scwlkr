      <text x="46" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="800">HH-WEBSITE</text>
      <path d="M260 -6H1030" stroke="#FFFFFF" stroke-opacity=".08"/>
      <text x="1052" text-anchor="end" fill="#7F7F7F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">2026.07.13</text>
