name: Deploy to Hostinger

on:
  push:
    branches:
      - master

defaults:
  run:
    working-directory: ./bubba-dashboard

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      
    - name: ⚙️ Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: 📦 Install dependencies
      run: npm install
      
    - name: 🏗️ Build Project
      # Passes the Google Apps Script URL as an environment variable during the build
      env:
        VITE_APPS_SCRIPT_URL: ${{ secrets.VITE_APPS_SCRIPT_URL }}
        BASE_URL: /bubba-dashboard/
      run: npm run build -- --base=/bubba-dashboard/
      
    - name: 📝 Inject Commit Hash
      run: |
        sed -i "s/__DEPLOYMENT_VERSION__/${GITHUB_SHA}/g" dist/index.html
        echo "{\"version\": \"${GITHUB_SHA}\", \"date\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}" > dist/version.json
      
    - name: 📂 Sync files (Deploy dist folder)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        dangerous-clean-slate: true
        # CRITICAL: We only sync the 'dist' folder generated by the build step inside the subfolder!
        local-dir: bubba-dashboard/dist/
        # This is where your subfolder lives on Hostinger
        server-dir: public_html/bubba-dashboard/
