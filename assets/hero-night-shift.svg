    <path d="M1073 414H704C672 414 656 430 624 430H16" stroke="#23CE6B" stroke-width="5" filter="url(#glow)"/>
    <circle cx="624" cy="430" r="7" fill="#23CE6B">
      <animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="16.75" y="16.75" width="1246.5" height="446.5" rx="17.25" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="1.5"/>
  <path d="M16 92H664" stroke="#FFFFFF" stroke-opacity=".1"/>
  <text x="52" y="58" fill="#23CE6B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="800" letter-spacing="2">SCWLKR // NIGHT SHIFT CONTROL ROOM</text>
  <circle cx="631" cy="52" r="6" fill="#23CE6B"/>
  <text x="52" y="139" fill="#FFFFFF" font-family="Arial Black, Arial, sans-serif" font-size="63" font-weight="900" letter-spacing="-3">ONE OPERATOR.</text>
  <text x="52" y="205" fill="#FFFFFF" font-family="Arial Black, Arial, sans-serif" font-size="63" font-weight="900" letter-spacing="-3">MANY SYSTEMS.</text>
  <text x="55" y="253" fill="#B7B7B7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">Dallas-built software for real work, strange worlds,</text>
  <text x="55" y="282" fill="#B7B7B7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">and recurring problems that finally annoyed me enough.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="800" letter-spacing="1.5">
    <rect x="52" y="322" width="116" height="38" rx="3" stroke="#23CE6B"/>
    <text x="79" y="347" fill="#23CE6B">TOOLS</text>
    <rect x="180" y="322" width="132" height="38" rx="3" stroke="#FFFFFF" stroke-opacity=".32"/>
    <text x="203" y="347" fill="#FFFFFF">WORLDS</text>
    <rect x="324" y="322" width="116" height="38" rx="3" stroke="#FFFFFF" stroke-opacity=".32"/>
    <text x="350" y="347" fill="#FFFFFF">INFRA</text>
  </g>

  <text x="52" y="400" fill="#777777" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">32.7767°N / 96.7970°W</text>
  <text x="52" y="448" fill="#23CE6B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="800">FIND FRICTION → STEAL USEFUL PARTS → SHIP THE MACHINE</text>
  <text x="966" y="448" fill="#777777" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">N00B UNTIL PROVEN GUILTY</text>
